<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Path | PathwayAI</title>
  <link rel="stylesheet" href="../../assets/css/shared.css" />
  <link rel="stylesheet" href="../../assets/css/dashboard.css" />
  <script>
    if (!localStorage.getItem('token')) window.location.replace('../auth/login.html');
  </script>
  <style>
    /* ── HERO ── */
    .lp-hero {
      background: linear-gradient(135deg, rgba(212,175,55,0.08) 0%, rgba(212,175,55,0.02) 50%, transparent 100%);
      border: 1px solid rgba(212,175,55,0.2);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }
    .lp-hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(212,175,55,0.6), transparent);
    }
    .lp-hero::after {
      content: '';
      position: absolute;
      bottom: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .lp-hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .lp-hero-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .lp-hero-title em { font-style: italic; color: var(--gold); }
    .lp-hero-sub { font-size: 13.5px; color: var(--muted); line-height: 1.6; }
    .lp-hero-sub strong { color: var(--text); font-weight: 600; }

    /* Stats */
    .lp-stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .lp-stat-cell {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .lp-stat-cell:hover { border-color: rgba(212,175,55,0.25); }
    .lp-stat-val {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--gold);
      line-height: 1;
      display: block;
    }
    .lp-stat-lbl { font-size: 11.5px; color: var(--muted); margin-top: 4px; display: block; }
    .lp-progress-wrap { margin-top: 4px; }
    .lp-progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .lp-progress-row strong { color: var(--gold); }
    .lp-bar { height: 6px; background: rgba(255,255,255,0.07); border-radius: 100px; overflow: hidden; }
    .lp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #8B6914, var(--gold), #F0D060);
      border-radius: 100px;
      transition: width 1.4s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── LAYOUT ── */
    .lp-layout {
      display: grid;
      grid-template-columns: 1fr 290px;
      gap: 22px;
      align-items: start;
    }
    @media (max-width: 1000px) { .lp-layout { grid-template-columns: 1fr; } }

    /* ── SKILL ROADMAP (replaces phases) ── */
    .lp-roadmap-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }
    .lp-roadmap-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(212,175,55,0.03);
    }
    .lp-roadmap-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .lp-roadmap-title em { color: var(--gold); font-style: italic; }
    .lp-roadmap-subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .lp-roadmap-body { padding: 28px 24px; }

    /* Timeline */
    .lp-timeline { position: relative; }
    .lp-timeline::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--gold) 0%, rgba(212,175,55,0.1) 100%);
    }
    .lp-tl-item {
      display: flex;
      gap: 20px;
      margin-bottom: 0;
      position: relative;
    }
    .lp-tl-item:last-child .lp-tl-content { border-bottom: none; margin-bottom: 0; }
    .lp-tl-dot-col { position: relative; z-index: 1; flex-shrink: 0; width: 42px; display: flex; flex-direction: column; align-items: center; }
    .lp-tl-dot {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 18px;
      border: 2px solid var(--border);
      background: var(--card2);
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .lp-tl-item.done .lp-tl-dot {
      background: rgba(76,175,112,0.15);
      border-color: rgba(76,175,112,0.5);
    }
    .lp-tl-item.active .lp-tl-dot {
      background: rgba(212,175,55,0.15);
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(212,175,55,0.1);
    }
    .lp-tl-content {
      flex: 1;
      padding-bottom: 28px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 0;
    }
    .lp-tl-item:last-child .lp-tl-content { border-bottom: none; }
    .lp-tl-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      margin-top: 8px;
    }
    .lp-tl-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
    }
    .lp-tl-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 100px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .done .lp-tl-badge { background: rgba(76,175,112,0.12); color: #4CAF70; border: 1px solid rgba(76,175,112,0.25); }
    .active .lp-tl-badge { background: rgba(212,175,55,0.12); color: var(--gold); border: 1px solid rgba(212,175,55,0.3); }
    .locked .lp-tl-badge { background: rgba(255,255,255,0.04); color: var(--subtle); border: 1px solid rgba(255,255,255,0.08); }
    .lp-tl-desc { font-size: 12.5px; color: var(--muted); line-height: 1.65; margin-bottom: 10px; }
    .lp-tl-skills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .lp-tl-skill-chip {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(212,175,55,0.07);
      border: 1px solid rgba(212,175,55,0.15);
      color: rgba(212,175,55,0.85);
    }
    .lp-tl-item.done .lp-tl-skill-chip {
      background: rgba(76,175,112,0.06);
      border-color: rgba(76,175,112,0.15);
      color: rgba(76,175,112,0.9);
    }
    .lp-tl-item.locked .lp-tl-skill-chip {
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.07);
      color: var(--subtle);
    }
    .lp-tl-meta { display: flex; align-items: center; gap: 14px; }
    .lp-tl-weeks { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .lp-tl-pbar { flex: 1; max-width: 120px; height: 4px; background: rgba(255,255,255,0.07); border-radius: 100px; overflow: hidden; }
    .lp-tl-pfill { height: 100%; border-radius: 100px; transition: width 1s ease; }
    .done .lp-tl-pfill { background: #4CAF70; width: 100%; }
    .active .lp-tl-pfill { background: var(--gold); width: 35%; }
    .locked .lp-tl-pfill { background: rgba(255,255,255,0.1); width: 0%; }
    .lp-tl-complete-btn {
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 8px;
      background: rgba(212,175,55,0.1);
      border: 1px solid rgba(212,175,55,0.3);
      color: var(--gold);
      cursor: pointer;
      transition: all 0.15s;
      margin-left: auto;
    }
    .lp-tl-complete-btn:hover { background: rgba(212,175,55,0.18); }

    /* ── SIDEBAR ── */
    .lp-sidebar { display: flex; flex-direction: column; gap: 16px; }
    .lp-widget {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
    }
    .lp-widget-head {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .lp-donut-wrap { position: relative; flex-shrink: 0; }
    .lp-readiness { display: flex; align-items: center; gap: 16px; }
    .lp-donut {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: conic-gradient(var(--gold) var(--deg), rgba(255,255,255,0.07) 0);
      display: grid;
      place-items: center;
    }
    .lp-donut::after {
      content: '';
      position: absolute;
      width: 50px; height: 50px;
      border-radius: 50%;
      background: var(--card);
    }
    .lp-donut-num { position: absolute; font-size: 13px; font-weight: 800; color: var(--gold); z-index: 1; }
    .lp-readiness-title { font-size: 13.5px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .lp-readiness-sub { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
    .lp-tip {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: rgba(212,175,55,0.05);
      border: 1px solid rgba(212,175,55,0.18);
      border-radius: 14px;
      padding: 15px 16px;
    }
    .lp-tip-ico { font-size: 20px; flex-shrink: 0; }
    .lp-tip-title { font-size: 13px; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
    .lp-tip-body { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .lp-tip-body strong { color: var(--text); }

    /* ── COURSES SECTION ── */
    .lp-section-wrap { margin-top: 24px; }
    .lp-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }
    .lp-section-left { display: flex; align-items: center; gap: 10px; }
    .lp-section-label { font-size: 15px; font-weight: 700; color: var(--text); }
    .lp-section-label em { font-style: italic; color: var(--gold); }
    .lp-section-badge {
      font-size: 11px; font-weight: 500;
      color: var(--muted);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 2px 10px;
    }

    /* Course cards */
    .lp-courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .lp-course-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .lp-course-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--gold), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .lp-course-card:hover { border-color: rgba(212,175,55,0.3); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
    .lp-course-card:hover::before { opacity: 1; }
    .lp-course-top { display: flex; align-items: flex-start; gap: 12px; }
    .lp-course-ico {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: rgba(212,175,55,0.1);
      border: 1px solid rgba(212,175,55,0.2);
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .lp-course-info { flex: 1; min-width: 0; }
    .lp-course-title { font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.35; margin-bottom: 2px; }
    .lp-course-platform { font-size: 11.5px; color: var(--gold); font-weight: 600; }
    .lp-course-desc { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .lp-course-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
    .lp-course-meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); }
    .lp-course-tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .lp-course-tag {
      font-size: 10.5px;
      padding: 2px 8px;
      border-radius: 100px;
    }
    .lp-course-link-arrow {
      font-size: 14px;
      color: var(--gold);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
    }
    .lp-course-card:hover .lp-course-link-arrow { opacity: 1; transform: translateX(3px); }

    /* Blog cards */
    .lp-blogs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .lp-blog-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .lp-blog-card:hover { border-color: rgba(212,175,55,0.3); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
    .lp-blog-top { display: flex; align-items: flex-start; gap: 12px; }
    .lp-blog-ico {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 20px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .lp-blog-info { flex: 1; }
    .lp-blog-title { font-size: 13.5px; font-weight: 700; color: var(--text); line-height: 1.35; margin-bottom: 2px; }
    .lp-blog-site-name { font-size: 11.5px; color: var(--gold); font-weight: 600; }
    .lp-blog-desc { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .lp-blog-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .lp-blog-tag {
      font-size: 10.5px;
      padding: 2px 8px;
      border-radius: 100px;
    }

    /* Skeleton */
    .lp-skeleton {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      animation: skpulse 1.4s ease infinite alternate;
    }
    .lp-sk-line { height: 10px; background: rgba(255,255,255,0.06); border-radius: 5px; margin-bottom: 8px; }

    @keyframes skpulse { from { opacity: 1; } to { opacity: 0.4; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Cache notice */
    .lp-cache-notice {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 100px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 11px;
      color: var(--subtle);
      margin-bottom: 16px;
    }

    /* Loading */
    .lp-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 100px 20px; gap: 20px; }
    .lp-spinner { width: 48px; height: 48px; border: 3px solid rgba(212,175,55,0.15); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lp-loading-text { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.7; }
    .lp-loading-text strong { color: var(--gold); display: block; font-size: 16px; margin-bottom: 4px; }

    /* Error */
    .lp-error { background: rgba(239,68,68,0.05); border: 1px solid rgba(239,68,68,0.2); border-radius: 16px; padding: 40px; text-align: center; }
    .lp-error h3 { font-size: 16px; color: #EF4444; margin-bottom: 8px; }
    .lp-error p { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }

    @media (max-width: 640px) {
      .lp-stats-row { grid-template-columns: 1fr 1fr; }
      .lp-courses-grid, .lp-blogs-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    <!-- MAIN -->

          <svg viewBox="0 0 24 24">

        </button>
        <div class="topbar-left">
          <h1>Learning <em style="font-style:italic;color:var(--gold)">Path</em></h1>
        </div>
        <div class="topbar-right">
          <div class="topbar-search">
